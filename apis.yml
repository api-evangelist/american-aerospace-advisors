description: American Aerospace Technologies, Inc., doing business as American Aerospace Advisors, is
  a defense and critical-infrastructure monitoring company based in Conshohocken, Pennsylvania. It provides
  end-to-end airborne intelligence systems that combine unmanned aircraft systems (UAS), airborne sensors,
  analytics, and communications to deliver near-real-time data through a cloud-based intelligence gateway.
  Its flagship AiRanger medium-altitude long-endurance unmanned aircraft and InstiMaps sensor technology
  support pipeline and linear-asset patrol, beyond-visual-line-of-sight (BVLOS) flight services, sensor
  integration, and aviation policy consulting. As of this enrichment pass the company publishes no public
  developer API, developer portal, or SDKs.
